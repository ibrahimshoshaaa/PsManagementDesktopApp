name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      # لازم تتشغل قبل الـ build عشان توّلد database.g.dart (كود Drift)
      # build_runner clean الأول: عشان نتجنب مشكلة الـ cache اللي بتخلي
      # build_runner يفتكر إنه بنى الملفات قبل كده ويسيبها من غير كتابة فعلية
      # (لاحظنا التحذير ده في تشغيل سابق: "--delete-conflicting-outputs" اتشالت
      # من نسخة build_runner الجديدة وبقى سلوك التعامل مع التعارضات مختلف).
      - name: Clean build_runner cache
        run: dart run build_runner clean
        continue-on-error: true

      - name: Remove .dart_tool (extra-clean, insurance against stale generator state)
        shell: pwsh
        run: |
          if (Test-Path ".dart_tool") { Remove-Item -Recurse -Force ".dart_tool" }

      - name: Get dependencies (again, after wiping .dart_tool)
        run: flutter pub get

      - name: Generate Drift code (build_runner)
        run: dart run build_runner build -v

      - name: List any generated .g.dart files (debug)
        shell: pwsh
        run: |
          Write-Host "كل ملفات .g.dart الموجودة دلوقتي:"
          Get-ChildItem -Recurse -Filter "*.g.dart" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Verify generated Drift code exists
        shell: pwsh
        run: |
          if (!(Test-Path "lib/data/local/database.g.dart")) {
            Write-Error "database.g.dart لم يتولد! لازم نوقف هنا قبل ما نكمل build_windows اللي هيدي أخطاء مضللة."
            exit 1
          }
          Write-Host "database.g.dart موجود، عدد الأسطر:"
          (Get-Content "lib/data/local/database.g.dart").Count

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip release build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "psapp-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psapp-windows-${{ github.sha }}
          path: psapp-windows.zip
          retention-days: 30

      # لو الـ push كان بتاج (v1.0.0 مثلاً)، بيعمل Release على GitHub تلقائيًا
      # ويرفق الـ zip عليه.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: psapp-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
